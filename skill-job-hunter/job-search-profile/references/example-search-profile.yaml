# Istanza di ESEMPIO del search-profile — prima istanza di test del progetto.
# Serve a mostrare come si compilano i campi dello schema canonico
# (agent-config/references/search-profile.schema.yaml).
# NON copiare questi valori nel profilo di un altro utente: ogni valore
# viene dall'intervista di onboarding di QUEL utente.

ruoli_target:
  - titolo_principale: Data Engineer
    sinonimi: []
  - titolo_principale: Analytics Engineer
    sinonimi: []
  - titolo_principale: BI Developer
    sinonimi: [Business Intelligence Developer]
  - titolo_principale: Data Analyst
    sinonimi: []
  - titolo_principale: IT Manager
    sinonimi: []

location_target:
  - area: Milano/Italia
    accetta_remoto: true
    accetta_ibrido: true
    priorita: alta
  - area: Amsterdam/Paesi Bassi
    accetta_remoto: true
    accetta_ibrido: true
    priorita: media
  - area: Belgio
    accetta_remoto: true
    accetta_ibrido: true
    priorita: media
  - area: Spagna
    accetta_remoto: true
    accetta_ibrido: true
    priorita: media
  - area: Remote Europe
    accetta_remoto: true
    accetta_ibrido: false
    priorita: media

seniority:
  livello: medio
  anni_esperienza_min: 3
  anni_esperienza_max: 6
  note: "livello medio, non senior — ruoli individuali/tecnici"

esclusioni:
  titoli_da_escludere: ["Head of", "Director", "VP", "C-level"]
  eccezione_se_ambiguo: true          # annunci ambigui segnalati comunque, non scartati
  tipo_contratto_da_escludere: [Internship, Traineeship, Stage]

settori:
  target: []
  esclusi: []

lingue_annuncio:
  accettate: [italiano, inglese]
  escluse_se_prevalenti: [olandese, spagnolo]
  escluse_se_obbligatorie: [olandese, spagnolo]
  tollerate_se_facoltative: [olandese, spagnolo]   # "nice to have" non scarta

fonti:
  - nome: indeed
    attiva: true
    note: "ricerca diretta via connettore"
  - nome: linkedin_alert
    attiva: true
    note: "alert email letti via Gmail; alcuni formati non hanno descrizione"
  - nome: indeed_alert
    attiva: true
    note: "alert email letti via Gmail"

parametri_esecuzione:
  finestra_temporale_ore: 48
  max_annunci_per_esecuzione: 15
